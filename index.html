<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMK00L</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #24152f;
      color: #fff7fc;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    main {
      max-width: 420px;
    }

    h1 {
      color: #ffb7e2;
      font-size: 2.5rem;
      margin-bottom: 8px;
      letter-spacing: 0.08em;
    }

    #quote {
      min-height: 150px;
      display: grid;
      place-items: center;
      font-size: 1.4rem;
      line-height: 1.5;
      margin: 28px 0;
    }

    button {
      width: min(78vw, 300px);
      aspect-ratio: 1;
      border: 8px solid #ffd6ef;
      border-radius: 50%;
      background: #ff55b7;
      color: white;
      font-size: 1.5rem;
      font-weight: 900;
      box-shadow: 0 12px 0 #a92775, 0 18px 35px #100a18aa;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #a92775;
    }

    .hint {
      margin-top: 28px;
      color: #d7c4df;
      font-size: 0.9rem;
    }
  </style>
</head>

<body>
  <main>
    <h1>IMK00L</h1>
    <p>Your pocket Stoic reminder.</p>

    <div id="quote" aria-live="polite">
      Press the button for a thought.
    </div>

    <button id="bigButton">PRESS ME</button>

    <p class="hint">One moment. One choice. One next step.</p>
  </main>

  <script>
    const quotes = [
      "I can’t command every outcome; I can choose my next action.",
      "My judgment is mine to examine.",
      "I meet what arrives with attention and courage.",
      "I don’t have to answer every impulse.",
      "The obstacle may become the work.",
      "I return to what is mine to do.",
      "A hard moment is still a moment.",
      "I can act with care without controlling how it lands.",
      "Let wisdom, courage, justice, and restraint guide me.",
      "I can pause between feeling and action.",
      "I will spend effort where effort can matter.",
      "I can release what belongs to chance.",
      "The present is where I can choose.",
      "My character travels with me.",
      "I can be firm and kind at once.",
      "Someone else’s opinion doesn’t dictate my conduct.",
      "I can do the next right thing without seeing the whole road.",
      "I will not turn a setback into a story about my worth.",
      "I can practice patience without becoming passive.",
      "I may not choose the weather; I can choose how I meet it.",
      "I am allowed to begin again right now.",
      "Let virtue be my goal, not applause.",
      "I will treat people fairly; their choices are theirs.",
      "I can ask what is in my control before I worry.",
      "My attention is precious; I will place it deliberately.",
      "I can let discomfort be present without obeying it.",
      "I will meet today fully, one moment at a time.",
      "Let me respond, not react.",
      "Peace grows when I stop demanding that reality follow my script.",
      "Even small acts can express strong character.",
      "I can carry disappointment without becoming it.",
      "I can be grateful for the chance to practice.",
      "I have this hour to use; let me use it well.",
      "I can welcome correction as information.",
      "I will measure progress by how I live, not how I look.",
      "I can uphold my values without controlling another person.",
      "When the plan changes, my values can still guide me.",
      "Calm is a practice, not a prize.",
      "I can make room for grief and still choose the next step.",
      "I will use what I have, where I am, with care.",
      "There is strength in restraint and courage in action.",
      "I can listen fully without surrendering my judgment.",
      "I can practice patience while keeping healthy boundaries.",
      "I will not borrow trouble from tomorrow.",
      "I can take responsibility without condemning myself.",
      "The way forward starts with the action available now.",
      "I can be generous without needing to be praised.",
      "I am part of a wider human community.",
      "I can return my attention to the task before me.",
      "Let me do the next thing with honesty, courage, and care."
    ].slice(0, 50);

    let previousIndex = -1;

    document.getElementById("bigButton").addEventListener("click", () => {
      let nextIndex = Math.floor(Math.random() * quotes.length);

      // Avoid showing the same reminder twice in a row.
      while (quotes.length > 1 && nextIndex === previousIndex) {
        nextIndex = Math.floor(Math.random() * quotes.length);
      }

      previousIndex = nextIndex;
      document.getElementById("quote").textContent = quotes[nextIndex];
    });
  </script>
</body>
</html>
